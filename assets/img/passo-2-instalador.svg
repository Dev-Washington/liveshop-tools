<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" role="img"
  aria-label="Ilustração: assistente de instalação do LiveShop Tools, com lateral de marca escura e botões Voltar, Avançar e Cancelar.">
  <title>Passo 2 — executar o instalador</title>

  <defs>
    <style>
      .bg { fill: #252525; }
      .chrome { fill: #2c2c2c; }
      .panel { fill: #343434; }
      .line { stroke: rgba(255,255,255,.11); stroke-width: 1; fill: none; }
      .dim { fill: #b5b5b5; }
      .soft { fill: #dcdcdc; }
      .fg { fill: #fafafa; }
      .brand { fill: #379d00; }
      .txt { font-family: Inter, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="420" height="240" rx="8" />

  <!-- barra de título -->
  <rect class="chrome" x="0" y="0" width="420" height="28" rx="8" />
  <rect class="chrome" x="0" y="18" width="420" height="10" />
  <text class="txt soft" x="16" y="18" font-size="10" font-weight="600">Instalação do LiveShop Tools</text>
  <path d="M396 10h10M396 14h10M396 18h10" stroke="#7a7a7a" stroke-width="1.4" stroke-linecap="round" />
  <line class="line" x1="0" y1="28" x2="420" y2="28" />

  <!-- lateral de marca (installer-sidebar.bmp) -->
  <rect class="chrome" x="0" y="28" width="128" height="168" />
  <rect class="brand" x="0" y="28" width="128" height="3" />
  <g transform="translate(30 66)">
    <path d="M0 0 44 4 18 30Z" fill="none" stroke="#39ff14" stroke-width="3" stroke-linejoin="round" />
  </g>
  <text class="txt fg" x="26" y="122" font-size="11" font-weight="800" letter-spacing=".5">LIVE SHOP</text>
  <text class="txt" x="26" y="135" font-size="10" font-weight="700" fill="#39ff14" font-style="italic">TOOLS</text>
  <rect class="panel" x="0" y="152" width="128" height="44" />
  <rect class="brand" x="14" y="172" width="34" height="3" rx="1.5" />

  <!-- conteúdo da página -->
  <text class="txt fg" x="150" y="58" font-size="13" font-weight="800">Bem-vindo ao LiveShop Tools</text>
  <rect x="150" y="72" width="248" height="6" rx="3" fill="#3d3d3d" />
  <rect x="150" y="86" width="230" height="6" rx="3" fill="#3d3d3d" />
  <rect x="150" y="100" width="196" height="6" rx="3" fill="#3d3d3d" />

  <text class="txt dim" x="150" y="130" font-size="9.5" font-weight="700" letter-spacing="1">PASTA DE INSTALAÇÃO</text>
  <rect x="150" y="138" width="200" height="22" rx="5" fill="#252525" />
  <rect class="line" x="150" y="138" width="200" height="22" rx="5" />
  <text class="txt dim" x="158" y="153" font-size="8.5" font-family="monospace">%LOCALAPPDATA%\Programs\…</text>
  <rect x="356" y="138" width="42" height="22" rx="5" fill="#3d3d3d" />
  <text class="txt soft" x="364" y="153" font-size="9">Procurar</text>

  <text class="txt" x="150" y="180" font-size="9" fill="#43b908">Não exige permissão de administrador.</text>

  <!-- rodapé com botões -->
  <line class="line" x1="0" y1="196" x2="420" y2="196" />
  <rect class="chrome" x="0" y="196" width="420" height="44" rx="8" />
  <rect class="chrome" x="0" y="196" width="420" height="20" />

  <rect x="196" y="206" width="58" height="24" rx="6" fill="#3a3a3a" />
  <text class="txt soft" x="212" y="222" font-size="9.5">Voltar</text>

  <rect class="brand" x="262" y="206" width="66" height="24" rx="6" />
  <text class="txt" x="278" y="222" font-size="9.5" font-weight="700" fill="#ffffff">Avançar</text>

  <rect x="336" y="206" width="62" height="24" rx="6" fill="#3a3a3a" />
  <text class="txt soft" x="349" y="222" font-size="9.5">Cancelar</text>
</svg>
